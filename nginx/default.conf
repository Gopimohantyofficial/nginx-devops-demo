server {
    listen 8080;
    server_name _;

    location = / {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "Date: $time_iso8601\nIP: $server_addr\nHostname: $hostname\n";
    }

    location = /health {
        default_type text/plain;
        return 200 "healthy\n";
    }
}
